name: Windows packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-windows.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Install locked Python dependencies and application
        run: |
          python -m pip install --require-hashes -r packaging/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build frozen core, Tauri shell, NSIS installer and portable ZIP
        # build_windows.py 内依次：PyInstaller onedir → check_windows_package
        # → smoke_frozen（冻结核心管道烟测，先于 Tauri 构建）→ tauri build
        # → 便携布局与壳二进制扫描 → ZIP/校验清单。
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

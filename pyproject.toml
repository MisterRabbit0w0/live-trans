[project]
name = "livetrans"
version = "0.1.0"
description = "实时直播翻译：捕获系统音频，本地/云端语音识别 + 翻译，悬浮窗双语字幕"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "packaging/licenses/*.txt"]
authors = [{ name = "MisterRabbit0w0" }]
keywords = ["translation", "live", "subtitle", "whisper", "asr", "streaming"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "faster-whisper>=1.1.0",
    "httpx>=0.27",
    "onnxruntime>=1.18",
    # Windows: WASAPI loopback and Process Loopback API
    "PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'",
    "pycaw>=20230407; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "psutil>=5.9; sys_platform == 'win32'",
    # macOS: ScreenCaptureKit (Linux uses the system pactl/parec commands)
    "pyobjc-framework-ScreenCaptureKit>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://github.com/MisterRabbit0w0/live-trans"
Repository = "https://github.com/MisterRabbit0w0/live-trans"

[project.scripts]
livetrans-core = "livetrans.app.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["livetrans*"]

[tool.setuptools.package-data]
livetrans = ["assets/*.onnx", "assets/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # 允许在默认参数中调用（回调默认值等场景）

[package]
name = "livetrans-desktop"
version = "0.1.0"
description = "LiveTrans desktop shell"
edition = "2021"
rust-version = "1.85"

[lib]
name = "livetrans_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "livetrans"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-notification = "=2.4.0"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-log = "=2.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-version = "0.100.0"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSColor",
    "NSColorSpace",
    "objc2-core-foundation",
] }
objc2-foundation = "0.3.2"
